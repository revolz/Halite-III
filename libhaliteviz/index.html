<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Halite III Replay Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111;
            color: #eee;
            font-family: sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #drop-zone {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1em;
            border: 4px dashed #444;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            user-select: none;
        }
        #drop-zone.dragover {
            border-color: #4af;
            background: rgba(68, 170, 255, 0.05);
        }
        #drop-zone h1 { font-size: 2em; }
        #drop-zone p { color: #888; }
        #drop-zone .key { color: #adf; }
        #file-input { display: none; }

        #viewer {
            display: none;
            width: 100vw;
            height: 100vh;
        }
        /* Make the PIXI canvas fill its container */
        #viewer canvas {
            display: block;
        }

        #resize-tip {
            display: none;
            position: fixed;
            bottom: 6px;
            right: 8px;
            background: rgba(0,0,0,0.55);
            color: #777;
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="drop-zone">
        <h1>Halite III Replay Viewer</h1>
        <p>Drop a <strong>.hlt</strong> replay file here, or click to browse</p>
        <p style="font-size:0.85em;color:#666">
            Controls: <span class="key">Space</span> play/pause &nbsp;
            <span class="key">←/→</span> step &nbsp;
            <span class="key">WASD</span> pan &nbsp;
            <span class="key">+/-</span> zoom &nbsp;
            Scroll-wheel zoom &nbsp; Drag to pan
        </p>
        <input type="file" id="file-input" accept=".hlt">
    </div>

    <div id="viewer"></div>
    <div id="resize-tip">Resize browser window to change map size</div>

    <script src="dist/bundle.js"></script>
    <script>
        var currentVisualizer = null;
        var currentReplay = null;
        var resizeTimer = null;

        function getViewSize() {
            return { w: window.innerWidth, h: window.innerHeight };
        }

        function fitScale(replay, w, h) {
            var mapW = replay.production_map.width;
            var mapH = replay.production_map.height;
            // CELL_SIZE = 1 in assets.js, so scale = pixels per cell
            var scale = h / mapH;
            if (mapW * scale > w) scale = w / mapW;
            return scale;
        }

        function launchVisualizer(replay) {
            currentReplay = replay;
            var dropZone = document.getElementById('drop-zone');
            var viewer   = document.getElementById('viewer');
            var tip      = document.getElementById('resize-tip');

            dropZone.style.display = 'none';
            viewer.style.display   = 'block';
            tip.style.display      = 'block';

            if (currentVisualizer) {
                currentVisualizer.destroy();
                viewer.innerHTML = '';
            }

            var sz = getViewSize();
            currentVisualizer = new libhaliteviz.EmbeddedVisualizer(replay, sz.w, sz.h);
            currentVisualizer.attach(viewer);
        }

        function handleResize() {
            if (!currentVisualizer || !currentReplay) return;
            var sz = getViewSize();
            var scale = fitScale(currentReplay, sz.w, sz.h);

            currentVisualizer.application.renderer.resize(sz.w, sz.h);
            currentVisualizer.width  = sz.w;
            currentVisualizer.height = sz.h;
            currentVisualizer.camera.initScale = scale;
            currentVisualizer.camera.reset();
        }

        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(handleResize, 150);
        });

        function readAndLoad(file) {
            var reader = new FileReader();
            reader.onload = function(ev) {
                libhaliteviz.parseReplay(ev.target.result).then(function(replay) {
                    launchVisualizer(replay);
                }).catch(function(e) {
                    alert('Could not parse replay. Make sure the file is a valid .hlt replay.');
                    console.error(e);
                });
            };
            reader.readAsArrayBuffer(file);
        }

        var dropZone  = document.getElementById('drop-zone');
        var fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', function() { fileInput.click(); });
        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) readAndLoad(e.target.files[0]);
        });

        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', function() {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) readAndLoad(e.dataTransfer.files[0]);
        });
    </script>
</body>
</html>
